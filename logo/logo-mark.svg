<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer circle (compass ring) -->
  <circle cx="60" cy="60" r="54" stroke="#0F1B2D" stroke-width="3" fill="none"/>
  <circle cx="60" cy="60" r="48" stroke="#0F1B2D" stroke-width="0.5" fill="none" opacity="0.3"/>
  
  <!-- Compass cross-hairs (N/S/E/W indicators) -->
  <line x1="60" y1="10" x2="60" y2="110" stroke="#C9A84C" stroke-width="0.8" opacity="0.25"/>
  <line x1="10" y1="60" x2="110" y2="60" stroke="#C9A84C" stroke-width="0.8" opacity="0.25"/>
  
  <!-- North indicator (gold triangle) -->
  <polygon points="60,14 57,24 63,24" fill="#C9A84C"/>
  
  <!-- "R" letterform integrated with compass needle -->
  <!-- Compass needle (northeast-pointing) -->
  <polygon points="60,60 82,38 72,72" fill="#0F1B2D"/>
  <polygon points="60,60 82,38 72,72" fill="#0F1B2D" opacity="0.9"/>
  
  <!-- The R shape - vertical stem -->
  <rect x="46" y="38" width="5" height="44" rx="2.5" fill="#0F1B2D"/>
  
  <!-- The R shape - bowl (curved top-right) -->
  <path d="M51 42 C51 42, 68 38, 68 52 C68 66, 54 60, 51 58" 
        stroke="#0F1B2D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  
  <!-- The R shape - leg -->
  <line x1="58" y1="62" x2="72" y2="82" stroke="#0F1B2D" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Gold accent dot -->
  <circle cx="60" cy="60" r="3" fill="#C9A84C"/>
  
  <!-- Cardinal direction labels -->
  <text x="60" y="8" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#4A5568" font-weight="600">N</text>
  <text x="60" y="126" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#4A5568" font-weight="600">S</text>
  <text x="8" y="63" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#4A5568" font-weight="600">W</text>
  <text x="112" y="63" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#4A5568" font-weight="600">E</text>
</svg>